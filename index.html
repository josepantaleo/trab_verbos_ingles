<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistemas Digitales - Resumen Clase 1</title>
    <style>
      a {
        font-size: 25px;
      }
      /* Estilos optimizados para modernizar el diseño */
      :root {
        --primary: #3a2c50;
        --secondary: #3498db;
        --accent: #e67e22;
        --bg: #f4f7f6;
        --text: #333;
        --white: #ffffff;
        --shadow: 0 4px 6px rgba(0, 0, 0, 0.07);
      }

      body {
        font-family:
          "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
        line-height: 1.6;
        color: var(--text);
        background-color: var(--bg);
        margin: 0;
        padding: 0;
      }

      header {
        background: var(--primary);
        color: var(--white);
        padding: 3rem 1rem;
        text-align: center;
        box-shadow: 0 2px 15px rgba(0, 0, 0, 0.2);
      }

      header h1 {
        margin: 0;
        font-size: 2.2rem;
        letter-spacing: -1px;
      }
      header p {
        margin: 8px 0 0;
        opacity: 0.9;
        font-size: 1.1rem;
      }

      .contenedor {
        max-width: 900px;
        margin: 30px auto;
        padding: 0 20px;
      }

      section {
        background: var(--white);
        margin-bottom: 30px;
        padding: 30px;
        border-radius: 15px;
        box-shadow: var(--shadow);
      }

      h2 {
        color: var(--primary);
        border-left: 6px solid var(--secondary);
        padding-left: 15px;
        margin-top: 0;
        font-size: 1.6rem;
      }

      h3 {
        color: var(--secondary);
        margin-top: 25px;
      }

      .resumen {
        background: #e8f5e9;
        color: #2e7d32;
        padding: 18px;
        border-radius: 10px;
        border-left: 5px solid #4caf50;
        font-weight: 600;
        margin: 20px 0;
      }

      .ejemplo {
        background: #fff9c4;
        color: #5d4037;
        padding: 18px;
        border-radius: 10px;
        border: 1px solid #ffe082;
        font-family: "Consolas", "Monaco", monospace;
        margin: 20px 0;
      }

      .tip {
        background: #e3f2fd;
        padding: 15px;
        border-radius: 8px;
        border-left: 4px solid var(--secondary);
        margin: 15px 0;
      }

      img {
        max-width: 100%;
        height: auto;
        display: block;
        margin: 20px auto;
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }

      /* Visor de PDF embebido */
      .pdf-viewer iframe {
        width: 100%;
        height: 600px;
        border: none;
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      }

      .columnas {
        display: flex;
        gap: 25px;
        flex-wrap: wrap;
        margin-top: 20px;
      }

      .columna {
        flex: 1;
        min-width: 280px;
        background: #fcfcfc;
        padding: 20px;
        border-radius: 12px;
        border: 1px solid #eee;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        margin: 20px 0;
        background: white;
      }

      th,
      td {
        border: 1px solid #edf2f7;
        padding: 14px;
        text-align: left;
      }

      th {
        background: var(--secondary);
        color: white;
      }
      tr:nth-child(even) {
        background-color: #f8fafc;
      }

      .container,
      .box {
        border: 1px solid #e2e8f0;
        padding: 20px;
        margin-bottom: 20px;
        border-radius: 10px;
        background: #fdfdfd;
      }

      .key {
        background: #e2e8f0;
        padding: 3px 6px;
        border-radius: 5px;
        font-family: monospace;
        font-weight: bold;
        color: #4a5568;
      }

      code {
        display: block;
        background: #1e1e1e;
        color: #dcdcdc;
        padding: 20px;
        border-radius: 10px;
        overflow-x: auto;
        font-family: "Consolas", monospace;
        font-size: 0.95rem;
        line-height: 1.6;
        word-spacing: 2px;
        white-space: pre-wrap;
      }

      footer {
        text-align: center;
        padding: 3rem;
        color: #94a3b8;
        font-size: 0.95rem;
      }

      a {
        color: var(--secondary);
        text-decoration: none;
        font-weight: bold;
        transition: color 0.2s;
      }
      a:hover {
        color: var(--accent);
        text-decoration: underline;
      }

      ul {
        list-style-type: none;
        padding-left: 10px;
      }
      ul li {
        margin-bottom: 8px;
      }

      /* Estilos específicos para la nueva actividad de la tarjeta */
      .opciones-container {
        display: flex;
        gap: 20px;
        flex-wrap: wrap;
        margin-top: 15px;
      }
      .opcion {
        flex: 1;
        min-width: 250px;
        background: #f8fafc;
        padding: 15px;
        border-radius: 8px;
        border: 1px solid #e2e8f0;
      }

      @media (max-width: 600px) {
        header h1 {
          font-size: 1.5rem;
        }
        section {
          padding: 20px;
        }
        .pdf-viewer iframe {
          height: 400px;
        }
      }
    </style>
  </head>

  <body>
    <header>
      <h1>IPEM 146 - Curso IA</h1>
      <p>5TO A Tarde - Informática</p>
      <p>Actividades</p>
      <p>Prof. J. Pantaleo</p>
    </header>

    <div class="contenedor">
        <h2>Instructivo</h2>
        <div class="pdf-viewer">
          <iframe src="INICIO%20-%20Curso%20autoasistido%20de%20Introducci%C3%B3n%20a%20la%20IA.pdf" title="Instructivo: Curso de Introducción a la IA" loading="lazy"></iframe>
          <p class="tip">Si no ves el PDF, <a href="INICIO - Curso autoasistido de Introducción a la IA.pdf" target="_blank" rel="noopener">ábrelo en otra pestaña</a>.</p>
        </div>
      <h2>Respuesta Actividad 1</h2>
      <img src="ACT1.jpg" alt="" />
      <h2>Respuesta Actividad 2</h2>
      <img src="ACT2.bmp" alt="" />
    </div>

    <footer>
      <p>IPEM 146 - Sistemas Digitales 2026</p>
    </footer>
  </body>
</html>
